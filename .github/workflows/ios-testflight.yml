# Builds the iOS app on GitHub's macOS runner and uploads it to TestFlight.
# This is what replaces owning a Mac.
#
# Free on public repos. On a private repo macOS minutes count 10x against the
# 2,000 free minutes/month — a build takes ~8 minutes, so roughly 25 builds a
# month before it costs anything.
#
# Set these repository secrets first (Settings → Secrets → Actions):
#   APPSTORE_ISSUER_ID     App Store Connect → Users and Access → Integrations
#   APPSTORE_KEY_ID        the key's ID
#   APPSTORE_PRIVATE_KEY   the whole .p8 file contents, including BEGIN/END lines
#
# That API key is all it needs — no Apple ID password, no 2FA dance, and it can
# be revoked from App Store Connect at any time.

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What testers should know about this build
        required: false
        default: Bathroom Finder test build
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    env:
      # Apple Team ID. Not a secret — it ships inside every signed binary.
      # Read off the App Store Connect API (bundleIds -> attributes.seedId)
      # rather than transcribed from a portal, because a wrong character here
      # surfaces as a signing error that reads like a certificate problem.
      TEAM_ID: 87836YN962

    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the image
        # Apple rejects uploads built against an old SDK: "This app was built
        # with the iOS 17.5 SDK. All iOS and iPadOS apps must be built with the
        # iOS 26 SDK or later." The runner defaults to whichever Xcode the image
        # calls current, which lags. Pick the highest installed rather than
        # pinning a version that will age out and fail the same way later.
        run: |
          echo "Xcodes on this image:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST"
            echo "selected: $NEWEST"
          else
            echo "::warning::no versioned Xcode found, using the image default"
          fi
          xcodebuild -version
          echo "iOS SDKs available:"
          xcodebuild -showsdks | grep -i ios || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the tests first
        run: |
          node tests/run.js
          node --test tests/api.test.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Drop the native AdMob plugin
        # @capacitor-community/admob 6.2 does not build against current pods.
        # It pins Google-Mobile-Ads-SDK to exactly 11.3.0, which pulls User
        # Messaging Platform 3.x, whose API it was not written for — every UMP
        # symbol it uses was renamed in 3.0. Pinning UMP back to 2.7 is refused
        # because the 2.x podspecs need a different deployment target. It is
        # broken upstream, not here.
        #
        # Removing it costs nothing right now: AdMob serves no ads until the app
        # is published and the AdMob account is reviewed, so a TestFlight build
        # would show none either way. admob.js already returns null when the
        # plugin is absent and the app falls back to its own sponsored-listing
        # slot, which is the revenue line that actually earns.
        #
        # Restore this when the plugin supports UMP 3.
        run: npm remove @capacitor-community/admob --no-save || true

      - name: Generate the iOS project
        # Same reasoning as the Android job: do not swallow this.
        run: |
          npx cap add ios
          test -f ios/App/App.xcodeproj/project.pbxproj || {
            echo "::error::cap add ios produced no project — is ios/ already present?"
            exit 1
          }

      - name: Patch Info.plist, the icon, and the backend URL
        env:
          # Repository variable (Settings → Secrets and variables → Actions →
          # Variables). Without it the app builds but nothing shared works.
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node tools/set-api-base.js
          node tools/prepare-ios.js

      - name: Copy the web app in
        # Must come after prepare-ios.js, which rewrites app/config.js —
        # cap sync is what copies app/ into the iOS bundle.
        run: npx cap sync ios

      - name: Set the build number from the run number
        run: |
          cd ios/App
          # CFBundleVersion must increase on every upload or App Store Connect
          # rejects it; the run number is monotonic and free.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" App/Info.plist
          MARKETING=$(node -p "require('../../package.json').version")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING" App/Info.plist
          echo "version $MARKETING build ${{ github.run_number }}"

      - name: Write the App Store Connect API key
        env:
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          # A .p8 pasted from a Windows clipboard arrives with CRLF endings.
          # The carriage returns survive into the file and CryptoKit rejects it
          # with "invalidPEMDocument", which reads like a bad or wrong key when
          # the key is perfectly good and only the whitespace is wrong. Strip
          # them rather than making the next person diagnose it.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/private_keys/AuthKey_${KEY_ID}.p8

          # A .p8 pasted without its "-----BEGIN PRIVATE KEY-----" and
          # "-----END PRIVATE KEY-----" lines is the single most common way this
          # secret goes wrong: the body is perfectly good base64 and every error
          # downstream just says the key is invalid. Rebuild the armour rather
          # than sending someone back to re-copy it.
          if ! grep -q 'BEGIN PRIVATE KEY' ~/private_keys/AuthKey_${KEY_ID}.p8; then
            echo "note: secret has no PEM header — rebuilding it around the body"
            {
              echo "-----BEGIN PRIVATE KEY-----"
              tr -d ' \t\r\n' < ~/private_keys/AuthKey_${KEY_ID}.p8 | fold -w 64
              echo
              echo "-----END PRIVATE KEY-----"
            } > ~/private_keys/rebuilt.p8
            mv ~/private_keys/rebuilt.p8 ~/private_keys/AuthKey_${KEY_ID}.p8
          fi
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

          # TEMPORARY diagnostic. Prints the shape of the secret and a
          # truncated hash so it can be compared against the file on disk —
          # never any key material. Remove once the upload is working.
          echo "--- secret shape (no key material) ---"
          echo "raw bytes      : $(printf '%s' "$KEY" | wc -c | tr -d ' ')"
          echo "raw sha256[16] : $(printf '%s' "$KEY" | shasum -a 256 | cut -c1-16)"
          echo "written bytes  : $(wc -c < ~/private_keys/AuthKey_${KEY_ID}.p8 | tr -d ' ')"
          echo "written lines  : $(wc -l < ~/private_keys/AuthKey_${KEY_ID}.p8 | tr -d ' ')"
          echo "has BEGIN      : $(grep -c 'BEGIN PRIVATE KEY' ~/private_keys/AuthKey_${KEY_ID}.p8 || true)"
          echo "has END        : $(grep -c 'END PRIVATE KEY' ~/private_keys/AuthKey_${KEY_ID}.p8 || true)"
          echo "carriage rets  : $(printf '%s' "$KEY" | tr -cd '\r' | wc -c | tr -d ' ')"
          echo "openssl says   : $(openssl pkey -in ~/private_keys/AuthKey_${KEY_ID}.p8 -noout 2>&1 | head -1 || true)"
          echo "a .p8 is normally 257 bytes over 6 lines; the rebuild above"
          echo "restores the header and footer if the paste dropped them"
          echo "--------------------------------------"

          # Structural check only. Note openssl happily parses a CRLF key, so
          # this would NOT have caught the failure above — the tr is the fix,
          # this just turns a truncated or half-pasted key into a clear error
          # instead of a confusing one from xcodebuild.
          if ! grep -q 'BEGIN PRIVATE KEY' ~/private_keys/AuthKey_${KEY_ID}.p8 \
             || ! openssl pkey -in ~/private_keys/AuthKey_${KEY_ID}.p8 -noout 2>/dev/null; then
            echo "::error::APPSTORE_PRIVATE_KEY is not a valid PEM private key."
            echo "Copy the .p8 exactly as it is on disk, including the"
            echo "-----BEGIN PRIVATE KEY----- and -----END PRIVATE KEY----- lines."
            exit 1
          fi
          echo "API key parsed OK"

      - name: Install the distribution certificate
        # Xcode's cloud signing is refused on this account — it cannot mint a
        # distribution identity, whichever API key role it is given. So do what
        # the Flappy Birdies pipeline already does successfully for this same
        # team: put a real signing identity in a throwaway keychain.
        #
        # The keychain is created per run and dies with the runner.
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -e
          if [ -z "$IOS_P12_BASE64" ]; then
            echo "::error::IOS_P12_BASE64 is not set. See IOS-SIGNING-STATUS.md."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo -n "$IOS_P12_BASE64" | tr -d '\r\n ' | base64 --decode -o "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          echo "identities now available to codesign:"
          security find-identity -v -p codesigning | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: Fetch the provisioning profile from Apple
        # Pulled live rather than kept in a secret: a .mobileprovision is not
        # sensitive (a copy ships in every build) and a stored one goes stale
        # the moment it is regenerated.
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -e
          DEST=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$DEST"
          node tools/fetch-profile.js "$DEST/BathroomFinder.mobileprovision"

      - name: Archive
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          cd ios/App
          # -allowProvisioningUpdates lets Xcode create the signing certificate
          # and profile through the API key, so nothing has to be set up by hand.
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            archive

      - name: Export the IPA
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bathroomfinder.app</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: Clean up the key
        if: always()
        run: rm -rf ~/private_keys

      - name: What happens next
        run: |
          echo "Uploaded. App Store Connect processes the build for 5–15 minutes,"
          echo "then it appears under TestFlight and your testers get an email."
