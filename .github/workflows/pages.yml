# Publishes the web app to GitHub Pages.
#
# Why this exists: a real https certificate, free, with no new account — which
# is what an iPhone needs before it will hand over location, register a service
# worker, or offer Add to Home Screen.
#
# The backend is separate. With no API host configured the app runs in solo
# mode: the map, search, filters, offline and photos all work, but reviews stay
# on the device. Set the API_BASE repository variable once a backend is live
# and the same site starts sharing.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check diffs against the previous commit, which a
          # shallow clone does not have.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test before publishing
        run: |
          node tests/run.js
          node --test tests/api.test.js

      - name: Will anyone already running the app actually get this?
        # The shell is served cache-first under a cache named after
        # APP_VERSION. Ship app/ without bumping it and the deploy is real,
        # the files on the server change, and every existing user keeps the
        # old app forever. That happened three commits running before this
        # check existed.
        run: node tools/check-version-bump.js

      - name: Point the app at the backend, if there is one
        env:
          API_BASE: ${{ vars.API_BASE }}
        # Read the value inside node from the environment. Interpolating it
        # through the shell into a -e string silently wrote the literal text
        # "$API_BASE" into the shipped config, and the deploy still passed.
        run: node tools/set-api-base.js

      - name: Fail if the backend URL did not actually get written
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -n "$API_BASE" ] && ! grep -q "apiBase: '$API_BASE'" app/config.js; then
            echo "config.js was not rewritten correctly:"
            grep "apiBase" app/config.js
            exit 1
          fi
          grep "apiBase" app/config.js

      - name: Pages needs this or it hides files starting with an underscore
        run: touch app/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
