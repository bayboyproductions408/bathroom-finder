# Builds the Android app bundle for Google Play.
#
# Capacitor, not a Trusted Web Activity. The TWA that used to live here could
# never verify: Digital Asset Links have to be served from the domain root, and
# this app is a GitHub Pages *project* site under /bathroom-finder/, so the root
# belongs to a repo that does not exist. An unverified TWA shows a browser
# address bar and is, to a reviewer, a website in a wrapper. See ANDROID-PLAN.md.
#
# Capacitor sidesteps all of that: real native app, native location and camera,
# no domain requirement, and the same shape as the iOS pipeline.
#
# Runs on Linux, which is free and does not burn the macOS 10x multiplier.
#
# Secrets needed for a *signed* bundle (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of android/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD from android/keystore.properties
#   ANDROID_KEY_ALIAS         likewise
#   ANDROID_KEY_PASSWORD      likewise
#
# Without them the job still runs and produces an UNSIGNED bundle, which is
# useful for checking the build compiles but cannot be uploaded to Play.

name: Android build

on:
  workflow_dispatch:
  push:
    # 'v*' is the joint release tag. 'android-v*' exists so Android can be
    # built on its own: the shared tag also fires ios-testflight.yml, and there
    # are times — a build already sitting in review, for one — when uploading a
    # new iOS binary is exactly what you do not want.
    tags: ['v*', 'android-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the tests first
        run: |
          node tests/run.js
          node --test tests/api.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the Android project
        # No "|| true" here. Swallowing this hid a real failure once: android/
        # existed (a stray committed .gitignore), cap add refused in 0s, and the
        # run carried on to fail three steps later with a misleading message.
        run: |
          npx cap add android
          test -f android/app/build.gradle || {
            echo "::error::cap add android produced no project — is android/ already present?"
            exit 1
          }

      - name: Patch signing, version and icon
        env:
          # versionCode must increase on every upload or Play refuses the
          # bundle; the run number is monotonic and free.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node tools/set-api-base.js
          node tools/prepare-android.js

      - name: Copy the web app in
        # After prepare-android, which rewrites app/config.js — cap sync is what
        # copies app/ into the bundle.
        run: npx cap sync android

      - name: Restore the signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 — building UNSIGNED. This bundle cannot be uploaded to Play."
            exit 0
          fi
          echo "$KS" | tr -d '\r\n ' | base64 -d > android/upload-keystore.jks
          cat > android/keystore.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
          echo "keystore restored ($(wc -c < android/upload-keystore.jks) bytes)"

      - name: Build the bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Clean up the key
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties

      - name: Say what came out
        run: |
          find android/app/build/outputs -name '*.aab' -print -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: bathroom-finder-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
