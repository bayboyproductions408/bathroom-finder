# Builds the Android app bundle for Google Play.
# Runs on Linux runners, which are free and don't burn the macOS multiplier.
#
# Secrets needed (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of android/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD from android/keystore.properties
#   ANDROID_KEY_ALIAS         bathroomfinder-upload
#   ANDROID_KEY_PASSWORD      same as the store password by default
#
# To produce the base64 on Windows:
#   certutil -encode android\upload-keystore.jks keystore.b64
# then paste the contents (without the BEGIN/END lines) as the secret.

name: Android build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the tests first
        run: |
          node tests/run.js
          node --test tests/api.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "No keystore secret set — building an unsigned bundle."
            exit 0
          fi
          echo "$KS" | base64 -d > android/upload-keystore.jks
          cat > android/keystore.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Build the bundle
        run: |
          cd android
          gradle wrapper --gradle-version 8.9 || true
          ./gradlew bundleRelease --no-daemon

      - name: Clean up the key
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: bathroom-finder-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
