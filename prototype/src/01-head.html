<title>Bathroom Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* ===== tokens: light is the base; both dark states redefine only tokens ===== */
:root{
  --porcelain:#E8EEEF; --surface:#FFFFFF; --surface-2:#EDF2F3; --surface-3:#F7FAFA;
  --ink:#0F1E1D; --ink-2:#556B69; --ink-3:#7C8F8D;
  --line:#D6E0E1; --line-soft:#E5ECED;
  --accent:#0F7B72; --accent-ink:#FFFFFF; --accent-soft:#D6EDEA; --accent-deep:#0A5A54;
  --open:#1B8A4B; --open-soft:#DCF0E4;
  --code:#B8770B; --code-soft:#F7EBD3;
  --ask:#3A6EA5; --ask-soft:#DEE9F5;
  --locked:#B23A2E; --locked-soft:#F6E0DC;
  --star:#E0A21A;
  --map-land:#DFE7E7; --map-block:#EDF2F2; --map-park:#CFE4CF; --map-water:#BFD9E4; --map-road:#FFFFFF; --map-road-2:#F4F8F8;
  --bezel:#171C1C; --bezel-2:#2A3231;
  --shadow:0 1px 2px rgba(15,30,29,.06), 0 8px 24px rgba(15,30,29,.08);
  --shadow-lg:0 -2px 8px rgba(15,30,29,.06), 0 -18px 44px rgba(15,30,29,.12);
  --tile:#DDE6E7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --porcelain:#0B1211; --surface:#141F1E; --surface-2:#1C2827; --surface-3:#101A19;
    --ink:#E9F0EF; --ink-2:#9DB0AE; --ink-3:#7B8E8C;
    --line:#263433; --line-soft:#1E2B2A;
    --accent:#35C4B4; --accent-ink:#04211F; --accent-soft:#123632; --accent-deep:#5FDDCE;
    --open:#46BE78; --open-soft:#123122;
    --code:#E0A83A; --code-soft:#33270D;
    --ask:#79A7D8; --ask-soft:#12243A;
    --locked:#E07C6B; --locked-soft:#3A1C17;
    --star:#F0BC4A;
    --map-land:#16211F; --map-block:#1B2726; --map-park:#1A3025; --map-water:#12303A; --map-road:#26332F; --map-road-2:#202C2A;
    --bezel:#000000; --bezel-2:#1C2322;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
    --shadow-lg:0 -2px 8px rgba(0,0,0,.35), 0 -18px 44px rgba(0,0,0,.55);
    --tile:#16201F;
  }
}
:root[data-theme="dark"]{
  --porcelain:#0B1211; --surface:#141F1E; --surface-2:#1C2827; --surface-3:#101A19;
  --ink:#E9F0EF; --ink-2:#9DB0AE; --ink-3:#7B8E8C;
  --line:#263433; --line-soft:#1E2B2A;
  --accent:#35C4B4; --accent-ink:#04211F; --accent-soft:#123632; --accent-deep:#5FDDCE;
  --open:#46BE78; --open-soft:#123122;
  --code:#E0A83A; --code-soft:#33270D;
  --ask:#79A7D8; --ask-soft:#12243A;
  --locked:#E07C6B; --locked-soft:#3A1C17;
  --star:#F0BC4A;
  --map-land:#16211F; --map-block:#1B2726; --map-park:#1A3025; --map-water:#12303A; --map-road:#26332F; --map-road-2:#202C2A;
  --bezel:#000000; --bezel-2:#1C2322;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  --shadow-lg:0 -2px 8px rgba(0,0,0,.35), 0 -18px 44px rgba(0,0,0,.55);
  --tile:#16201F;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--porcelain); color:var(--ink);
  font-family:"Public Sans","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Archivo,"Public Sans",system-ui,sans-serif; letter-spacing:-.02em; text-wrap:balance; margin:0}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* ===== desktop stage: faint tile grout behind the device ===== */
.stage{
  min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:20px; padding:28px 16px 34px;
  background-image:
    linear-gradient(var(--tile) 1px, transparent 1px),
    linear-gradient(90deg, var(--tile) 1px, transparent 1px);
  background-size:44px 44px, 44px 44px;
  background-position:center;
}
.stage-head{text-align:center; max-width:44ch}
.stage-head .wordmark{display:flex; align-items:center; justify-content:center; gap:10px; font-family:Archivo; font-weight:800; font-size:20px; letter-spacing:-.03em}
.stage-head .wordmark .glyph{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.stage-head p{margin:8px 0 0; color:var(--ink-2); font-size:13.5px; line-height:1.55}
.stage-head .demo-tag{display:inline-block;margin-top:10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

.phone{
  position:relative; width:min(400px, 100%); height:min(844px, 86dvh);
  background:var(--bezel); border-radius:52px; padding:11px;
  box-shadow:0 2px 4px rgba(0,0,0,.2), 0 30px 70px rgba(15,30,29,.28), inset 0 0 0 1.5px var(--bezel-2);
  flex:0 0 auto;
}
.viewport{
  position:relative; width:100%; height:100%; border-radius:42px; overflow:hidden;
  background:var(--surface-3); display:flex; flex-direction:column;
}
.island{position:absolute; top:9px; left:50%; transform:translateX(-50%); width:104px; height:27px; border-radius:999px; background:var(--bezel); z-index:60}

/* ===== status bar ===== */
.statusbar{
  flex:0 0 auto; height:46px; display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px 0; font-size:12.5px; font-weight:600; color:var(--ink); background:transparent;
  position:relative; z-index:55; pointer-events:none;
}
.statusbar .sigs{display:flex; align-items:center; gap:5px}

/* ===== screens ===== */
.screens{position:relative; flex:1 1 auto; overflow:hidden}
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column; background:var(--surface-3);
  overflow:hidden; visibility:hidden; opacity:0; transition:opacity .18s ease, transform .22s cubic-bezier(.32,.72,0,1);
}
.screen[data-active="true"]{visibility:visible; opacity:1}
.screen.push{transform:translateX(14px)}
.screen.push[data-active="true"]{transform:translateX(0)}
.scroll{flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

/* ===== top bars ===== */
.topbar{flex:0 0 auto; padding:4px 16px 12px; display:flex; flex-direction:column; gap:10px; background:var(--surface); border-bottom:1px solid var(--line-soft); z-index:20}
.screen-title{font-size:23px; font-weight:800}
.screen-sub{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.search{
  display:flex; align-items:center; gap:9px; height:42px; padding:0 13px;
  background:var(--surface-2); border:1px solid transparent; border-radius:13px; color:var(--ink-2);
  transition:border-color .15s ease, background .15s ease;
}
.search:focus-within{border-color:var(--accent); background:var(--surface)}
.search input{flex:1; border:none; background:none; outline:none; font-size:15px; color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.locrow{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2)}
.locrow b{color:var(--ink); font-weight:600}

/* chips */
.chiprow{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.chiprow::-webkit-scrollbar{height:0}
.chip{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:5px; height:31px; padding:0 12px;
  border-radius:999px; border:1px solid var(--line); background:var(--surface);
  font-size:12.5px; font-weight:600; color:var(--ink-2); white-space:nowrap;
  transition:background .14s ease, color .14s ease, border-color .14s ease, transform .1s ease;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* ===== pills / status ===== */
.pill{
  display:inline-flex; align-items:center; gap:5px; height:23px; padding:0 9px; border-radius:7px;
  font-size:11px; font-weight:700; letter-spacing:.02em; white-space:nowrap;
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.open{background:var(--open-soft); color:var(--open)}
.pill.code{background:var(--code-soft); color:var(--code)}
.pill.ask{background:var(--ask-soft); color:var(--ask)}
.pill.locked{background:var(--locked-soft); color:var(--locked)}
.pill.ghost{background:var(--surface-2); color:var(--ink-2)}

.label{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:700; color:var(--ink-3)}

/* ===== map ===== */
#screen-map{background:var(--map-land)}
.mapwrap{position:absolute; inset:0; overflow:hidden}
.mapsvg{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(1.02); width:118%; height:118%}
.pin{cursor:pointer; transform-box:fill-box; transform-origin:50% 100%; transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.pin:hover{transform:scale(1.08)}
.pin[data-sel="true"]{transform:scale(1.22)}
.pin-body{filter:drop-shadow(0 3px 5px rgba(0,0,0,.28))}
.pin-label{font-family:"Public Sans"; font-size:9px; font-weight:700; fill:#fff}
.me-ring{animation:pulse 2.6s ease-out infinite; transform-origin:center}
@keyframes pulse{0%{r:9; opacity:.5} 70%{r:26; opacity:0} 100%{r:26; opacity:0}}
.maptools{position:absolute; right:14px; display:flex; flex-direction:column; gap:8px; z-index:14}
.mapbtn{
  width:40px; height:40px; border-radius:13px; background:var(--surface); color:var(--ink);
  display:grid; place-items:center; box-shadow:var(--shadow); border:1px solid var(--line-soft);
}
.mapbtn:active{transform:scale(.94)}

/* ===== bottom sheet ===== */
.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  background:var(--surface); border-radius:22px 22px 0 0; box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column; height:76%; transform:translateY(calc(100% - 232px));
  transition:transform .34s cubic-bezier(.32,.72,0,1);
}
.sheet[data-state="full"]{transform:translateY(0)}
.sheet.dragging{transition:none}
.sheet-grab{flex:0 0 auto; padding:9px 0 4px; display:grid; place-items:center; cursor:grab; touch-action:none}
.sheet-grab i{display:block; width:38px; height:4.5px; border-radius:999px; background:var(--line)}
.sheet-head{flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between; padding:2px 16px 10px}
.sheet-head h2{font-size:16.5px; font-weight:800}
.sheet-head .sortbtn{font-size:12px; font-weight:600; color:var(--accent); display:inline-flex; align-items:center; gap:4px}
.sheet-list{flex:1 1 auto; overflow-y:auto; padding:0 12px 16px; scrollbar-width:none}
.sheet-list::-webkit-scrollbar{width:0}

/* ===== bathroom row ===== */
.row{
  display:grid; grid-template-columns:62px 1fr auto; gap:12px; align-items:center;
  padding:11px 8px; border-radius:16px; text-align:left; width:100%;
  transition:background .14s ease;
}
.row + .row{border-top:1px solid var(--line-soft)}
.row:active{background:var(--surface-2)}
.row .thumb{width:62px; height:62px; border-radius:13px; overflow:hidden; background:var(--surface-2); position:relative}
.row .thumb svg{width:100%; height:100%; display:block}
.row h3{font-size:14.5px; font-weight:700; letter-spacing:-.01em; line-height:1.25}
.row .meta{display:flex; align-items:center; gap:6px; margin-top:4px; font-size:12px; color:var(--ink-2)}
.row .meta .sep{color:var(--ink-3)}
.row .tail{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.row .dist{font-size:12px; font-weight:600; color:var(--ink-2)}
.stars{display:inline-flex; align-items:center; gap:1.5px}
.stars svg{width:12px; height:12px}
.rating-inline{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-2)}
.rating-inline b{color:var(--ink); font-weight:700}
.savebtn{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:var(--ink-3); background:var(--surface-2)}
.savebtn[aria-pressed="true"]{color:var(--star); background:var(--surface-2)}
.savebtn:active{transform:scale(.9)}

/* ===== detail ===== */
.hero{position:relative; flex:0 0 auto; height:212px; background:var(--surface-2)}
.hero .strip{display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none}
.hero .strip::-webkit-scrollbar{height:0}
.hero .strip > button{flex:0 0 100%; scroll-snap-align:center; height:100%; padding:0}
.hero .strip svg{width:100%; height:100%; display:block}
.hero-fade{position:absolute; inset:0 0 auto; height:90px; background:linear-gradient(rgba(0,0,0,.42), transparent); pointer-events:none}
.hero-nav{position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; z-index:5}
.circbtn{width:36px;height:36px;border-radius:50%; background:rgba(12,20,19,.55); color:#fff; display:grid; place-items:center; backdrop-filter:blur(6px)}
.circbtn:active{transform:scale(.92)}
.hero-count{position:absolute; right:12px; bottom:12px; background:rgba(12,20,19,.6); color:#fff; font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px; backdrop-filter:blur(6px)}
.detail-head{padding:16px 16px 14px; background:var(--surface); border-bottom:1px solid var(--line-soft)}
.detail-head h1{font-size:24px; font-weight:800; line-height:1.14}
.detail-head .kind{margin-top:6px; font-size:12.5px; color:var(--ink-2)}
.ratingline{display:flex; align-items:center; gap:8px; margin-top:9px}
.ratingline .big{font-family:Archivo; font-weight:800; font-size:19px}
.statuscard{
  margin:12px 16px 0; padding:13px 14px; border-radius:16px; border:1px solid var(--line);
  background:var(--surface); display:flex; flex-direction:column; gap:10px;
}
.statuscard .top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.statuscard .note{font-size:13px; color:var(--ink-2); line-height:1.5}
.statuscard .note b{color:var(--ink); font-weight:600}
.codebox{
  display:inline-flex; align-items:center; gap:8px; align-self:flex-start; padding:7px 11px; border-radius:11px;
  background:var(--surface-2); font-family:Archivo; font-weight:800; letter-spacing:.22em; font-size:16px;
}
.confirmrow{display:flex; align-items:center; gap:8px; padding-top:10px; border-top:1px dashed var(--line)}
.confirmrow .q{flex:1; font-size:12.5px; color:var(--ink-2); line-height:1.35}
.minibtn{
  display:inline-flex; align-items:center; gap:5px; height:32px; padding:0 11px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); font-size:12.5px; font-weight:700;
}
.minibtn:active{transform:scale(.95)}
.minibtn.yes{color:var(--open); border-color:color-mix(in srgb, var(--open) 34%, transparent)}
.minibtn.no{color:var(--locked); border-color:color-mix(in srgb, var(--locked) 34%, transparent)}

.actionrow{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:14px 16px 4px}
.action{display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border-radius:14px; background:var(--surface); border:1px solid var(--line-soft); font-size:11px; font-weight:600; color:var(--ink-2)}
.action svg{color:var(--accent)}
.action:active{transform:scale(.96)}
.action[aria-pressed="true"]{background:var(--accent-soft); border-color:transparent; color:var(--accent)}
.action[aria-pressed="true"] svg{color:var(--accent)}

.section{padding:18px 16px 4px}
.section h2{font-size:15.5px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between}
.section h2 .more{font-size:12px; font-weight:600; color:var(--accent); font-family:"Public Sans"}
.card{background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; padding:14px}

.amenities{display:flex; flex-wrap:wrap; gap:7px}
.amenity{display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:10px; background:var(--surface); border:1px solid var(--line-soft); font-size:12px; font-weight:600; color:var(--ink-2)}
.amenity svg{color:var(--accent)}
.amenity.off{color:var(--ink-3); opacity:.62}
.amenity.off svg{color:var(--ink-3)}

.scores{display:flex; flex-direction:column; gap:11px}
.score{display:grid; grid-template-columns:88px 1fr 30px; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-2)}
.score .bar{height:7px; border-radius:999px; background:var(--surface-2); overflow:hidden}
.score .bar i{display:block; height:100%; border-radius:999px; background:var(--accent); transform-origin:left; animation:grow .6s cubic-bezier(.32,.72,0,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.score b{color:var(--ink); font-weight:700; text-align:right}

.photogrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.photogrid button{aspect-ratio:1; border-radius:11px; overflow:hidden; background:var(--surface-2); padding:0}
.photogrid svg{width:100%; height:100%; display:block}
.photogrid .more-photos{position:relative; display:grid; place-items:center; font-weight:700; font-size:13px; color:var(--ink-2)}

.review{padding:14px 0; border-top:1px solid var(--line-soft)}
.review:first-child{border-top:none; padding-top:2px}
.rhead{display:flex; gap:10px; align-items:center}
.avatar{width:36px;height:36px;border-radius:50%; display:grid; place-items:center; font-family:Archivo; font-weight:700; font-size:13px; color:#fff; flex:0 0 auto}
.rname{font-size:13.5px; font-weight:700; line-height:1.2}
.rmeta{font-size:11.5px; color:var(--ink-3); margin-top:2px; display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.rlevel{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); padding:2px 6px; border-radius:5px}
.rbody{font-size:13.5px; line-height:1.6; color:var(--ink); margin-top:9px}
.rtags{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.rtag{font-size:11px; font-weight:600; color:var(--ink-2); background:var(--surface-2); border-radius:999px; padding:4px 9px}
.rphotos{display:flex; gap:6px; margin-top:9px}
.rphotos button{width:74px;height:74px;border-radius:10px; overflow:hidden; padding:0; background:var(--surface-2)}
.rphotos svg{width:100%;height:100%;display:block}
.rfoot{display:flex; gap:8px; margin-top:11px}
.rfoot .minibtn{height:29px; font-size:11.5px; font-weight:600; color:var(--ink-2)}
.rfoot .minibtn[aria-pressed="true"]{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
.reply{margin:11px 0 0 46px; padding:11px 12px; border-radius:13px; background:var(--surface-2)}
.reply .rname{font-size:12.5px}
.reply .rbody{font-size:12.5px; margin-top:6px}

/* ===== forms ===== */
.field{display:flex; flex-direction:column; gap:7px; margin-bottom:15px}
.field > span{font-size:12.5px; font-weight:700; color:var(--ink)}
.field .hint{font-size:11.5px; color:var(--ink-3); font-weight:400}
.input{
  width:100%; height:46px; padding:0 13px; border-radius:13px; border:1px solid var(--line);
  background:var(--surface); font-size:14.5px; outline:none; transition:border-color .15s ease;
}
textarea.input{height:auto; padding:12px 13px; min-height:96px; resize:vertical; line-height:1.55; font-family:inherit}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--ink-3)}
.seg{display:grid; grid-auto-flow:column; gap:6px; background:var(--surface-2); padding:4px; border-radius:13px}
.seg button{padding:9px 6px; border-radius:10px; font-size:12.5px; font-weight:700; color:var(--ink-2); transition:background .15s ease, color .15s ease}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.toggle-list{display:flex; flex-direction:column; gap:2px}
.toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 2px; font-size:14px}
.toggle + .toggle{border-top:1px solid var(--line-soft)}
.switch{width:46px; height:27px; border-radius:999px; background:var(--surface-2); position:relative; flex:0 0 auto; transition:background .18s ease}
.switch i{position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow); transition:transform .2s cubic-bezier(.34,1.4,.64,1)}
.switch[aria-pressed="true"]{background:var(--accent)}
.switch[aria-pressed="true"] i{transform:translateX(19px)}
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:50px;
  border-radius:15px; background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:700;
  transition:transform .1s ease, filter .15s ease;
}
.btn:active{transform:scale(.985); filter:brightness(1.06)}
