function tileWall(t,w,h,cell){
  let s=`<rect width="${w}" height="${h}" fill="${t.wall}"/>`;
  for(let y=0;y<h;y+=cell) s+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${t.wall2}" stroke-width="1"/>`;
  for(let x=0;x<w;x+=cell) s+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${t.wall2}" stroke-width="1"/>`;
  return s;
}
