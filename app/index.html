<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7B72">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bathroom Finder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Bathroom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Find a bathroom you can actually use — is it open, is it clean, and what did the last person say.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <!-- ============ MAP ============ -->
  <div id="map" aria-label="World map of bathrooms"></div>

  <div class="overlay-top">
    <div class="searchwrap">
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
        <input id="q" type="search" placeholder="Search any city, address or place" autocomplete="off" enterkeyhint="search">
        <button id="q-clear" class="iconbtn" aria-label="Clear search" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </label>
      <button id="btn-theme" class="iconbtn solid" aria-label="Toggle dark mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8.5 8.5 0 0 1 9.6 4 8.5 8.5 0 1 0 20 14.4Z"/></svg>
      </button>
    </div>
    <div id="results" class="results" hidden></div>
    <div class="chiprow" id="chips"></div>
  </div>

  <div class="overlay-right">
    <button class="mapbtn" id="btn-locate" aria-label="Find my location">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2"/><circle cx="12" cy="12" r="8.4"/></svg>
    </button>
    <button class="mapbtn" id="btn-add" aria-label="Add a bathroom here">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <button id="search-here" class="search-here" hidden>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11.5a8.5 8.5 0 1 1-2.5-6"/><path d="M20 4v5h-5"/></svg>
    Search this area
  </button>
  <button id="btn-install" class="install-btn" hidden>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M12 15l-4-4M12 15l4-4"/><path d="M5 20h14"/></svg>
    Add to home screen
  </button>
  <div id="offline" class="offline-bar" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M5 12a10 10 0 0 1 3.5-2.3M19 12a10 10 0 0 0-8.5-2.9"/></svg>
    Offline — showing what you already loaded
  </div>
  <div id="syncbadge" class="syncbadge" hidden></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <!-- ============ BOTTOM SHEET ============ -->
  <div class="sheet" id="sheet" data-state="peek">
    <div class="sheet-grab" id="grab" role="button" tabindex="0" aria-label="Expand the list"><i></i></div>
    <div class="sheet-head">
      <h2 id="sheet-count">Move the map to load bathrooms</h2>
      <button class="sortbtn" id="btn-sort"><span id="sort-label">Closest</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
      </button>
    </div>
    <div class="sheet-list" id="sheet-list"></div>
  </div>

  <!-- ============ FULL SCREENS ============ -->
  <section class="panel" id="panel-detail" aria-label="Details"><div class="panel-scroll" id="detail-body"></div></section>
  <section class="panel" id="panel-saved" aria-label="Saved">
    <div class="panel-head"><button class="circbtn" data-close-panel aria-label="Back">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <h1>Saved</h1></div>
    <div class="panel-scroll" id="saved-body"></div>
  </section>
  <section class="panel" id="panel-profile" aria-label="Profile">
    <div class="panel-head"><button class="circbtn" data-close-panel aria-label="Back">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <h1>Profile</h1></div>
    <div class="panel-scroll" id="profile-body"></div>
  </section>
  <section class="panel" id="panel-host" aria-label="List your bathroom">
    <div class="panel-head"><button class="circbtn" data-close-panel aria-label="Back">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <h1>List your bathroom</h1></div>
    <div class="panel-scroll" id="host-body"></div>
  </section>
  <section class="panel" id="panel-bookings" aria-label="Your visits">
    <div class="panel-head"><button class="circbtn" data-close-panel aria-label="Back">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <h1>Your visits</h1></div>
    <div class="panel-scroll" id="bookings-body"></div>
  </section>
  <section class="panel" id="panel-booking" aria-label="Visit details">
    <div class="panel-head"><button class="circbtn" data-close-panel aria-label="Back">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <h1>Visit</h1></div>
    <div class="panel-scroll" id="booking-body"></div>
  </section>
  <section class="panel" id="panel-console" aria-label="Host console">
    <div class="panel-head"><button class="circbtn" data-close-panel aria-label="Back">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <h1>Host console</h1></div>
    <div class="panel-scroll" id="console-body"></div>
  </section>
  <section class="panel" id="panel-moderation" aria-label="Photo review queue">
    <div class="panel-head"><button class="circbtn" data-close-panel aria-label="Back">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <h1>Photo review</h1></div>
    <div class="panel-scroll" id="moderation-body"></div>
  </section>

  <!-- ============ TAB BAR ============ -->
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="tab" data-go="map" aria-current="page">
      <span class="tabicon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 5.4v15L9 18l6 3 6-2.4v-15L15 6 9 3Z"/><path d="M9 3v15M15 6v15"/></svg></span>Map</button>
    <button class="tab" data-go="list">
      <span class="tabicon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span>Nearby</button>
    <button class="tab add" data-go="host">
      <span class="tabicon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2 12 4.5l8 6.7"/><path d="M6.4 10.2V19h11.2v-8.8"/></svg></span>Host</button>
    <button class="tab" data-go="saved">
      <span class="tabicon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.6 2.6 5.3 5.9.85-4.25 4.15 1 5.85L12 17l-5.25 2.75 1-5.85L3.5 9.75l5.9-.85L12 3.6Z"/></svg><span class="savedot num" id="savecount" hidden>0</span></span>Saved</button>
    <button class="tab" data-go="profile">
      <span class="tabicon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></span>Profile</button>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="veil" id="veil"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true"></div>

  <!-- drop-a-pin mode -->
  <div class="dropbar" id="dropbar" hidden>
    <span>Drag the map to put the crosshair on the bathroom</span>
    <div class="dropbar-btns">
      <button class="minibtn" id="drop-cancel">Cancel</button>
      <button class="btn small" id="drop-confirm">Set location</button>
    </div>
  </div>
  <div class="crosshair" id="crosshair" hidden aria-hidden="true">
    <svg viewBox="0 0 60 60" width="60" height="60"><circle cx="30" cy="30" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M30 4v12M30 44v12M4 30h12M44 30h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="30" cy="30" r="3" fill="currentColor"/></svg>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script src="sync.js"></script>
<script src="ads.js"></script>
<script src="moderation.js"></script>
<script src="rentals.js"></script>
<script src="app.js"></script>
</body>
</html>
