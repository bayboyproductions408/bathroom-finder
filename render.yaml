# One-click config for Render's free tier.
#   New → Blueprint → point at this repo. No card required.
services:
  - type: web
    name: bathroom-finder
    runtime: node
    plan: free
    # The server itself needs exactly one dependency: the libSQL client that
    # talks to Turso. --omit=dev skips the Capacitor tooling, which is only
    # used when building the native apps on a developer machine.
    buildCommand: "npm ci --omit=dev"
    startCommand: "node serve.js"
    healthCheckPath: /api/v1/health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true      # Render invents a strong one; read it in the dashboard
      - key: NODE_VERSION
        value: "22"
